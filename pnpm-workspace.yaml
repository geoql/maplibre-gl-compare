packages:
  - example

overrides:
  # Keep `vite` (peer/type-only in this workspace) on the same instance as Vite+
  # so there is never a split Vite copy.
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0

peerDependencyRules:
  allowedVersions:
    # vite-plus-core satisfies vitest's `vite` peer (it IS the Vite 8 fork).
    vite: '*'

allowBuilds:
  esbuild: true
  workerd: true

# Latest releases of these toolchains land inside pnpm's 1-day minimumReleaseAge.
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - wrangler
  - miniflare
